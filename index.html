:root{
  --vino:#651037; --vino-osc:#4a0b28; --vino-suave:#f4e8ed; --vino-linea:#e3c9d3;
  --fondo:#f6f3f1; --tarjeta:#ffffff; --tinta:#241a1e; --suave:#6e6166; --linea:#e6dfdc;
  --ok:#1c7a4c; --ok-suave:#e5f3ec; --alerta:#a8540a; --alerta-suave:#fdf0df; --rojo:#b3261e;
  --radio:16px; --sombra:0 1px 2px rgba(36,26,30,.05),0 4px 14px rgba(36,26,30,.04);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--fondo);color:var(--tinta);
  font:16px/1.45 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
body{min-height:100dvh;overscroll-behavior-y:contain}
#app{max-width:640px;margin:0 auto;padding:0 16px calc(130px + env(safe-area-inset-bottom))}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--vino-linea);outline-offset:2px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Encabezado vinotinto (fijo al bajar) */
.barra{position:sticky;top:0;z-index:5;margin:0 -16px;padding:calc(10px + env(safe-area-inset-top)) 16px 12px;background:var(--vino);color:#fff}
.barra .top{display:flex;align-items:center;gap:12px}
.barra h2{font-size:17px;font-weight:800;line-height:1.25;flex:1;min-width:0;overflow-wrap:anywhere}
.barra small{display:block;font-weight:500;opacity:.82;font-size:13px}
.barra .ico{background:rgba(255,255,255,.15);border:0;color:#fff;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none}
.av{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin:12px 0 6px;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:9px;background:rgba(255,255,255,.22);overflow:hidden}
.bar i{display:block;height:100%;background:#fff;border-radius:9px;transition:width .3s}

/* Franja de conexión */
.franja{display:flex;align-items:center;gap:8px;margin:0 -16px 14px;padding:8px 16px;font-size:13px;font-weight:600;background:var(--ok-suave);color:var(--ok);min-height:38px}
.franja.off{background:#ece7e5;color:#5a4f53}
.franja.sub{background:var(--alerta-suave);color:var(--alerta)}
.franja svg.i{width:16px;height:16px}
.franja span{flex:1}
.franja button{border:0;background:#fff;color:inherit;font-weight:800;font-size:13px;border-radius:99px;padding:6px 12px;min-height:32px}
.franja.arriba{padding-top:calc(8px + env(safe-area-inset-top))}

/* Portada */
.marca{display:flex;align-items:center;gap:14px;padding:6px 0 18px}
.marca img{width:68px;height:68px;border-radius:50%;flex:none}
.marca small{color:var(--vino);font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:11px}
.marca h1{font-size:20px;line-height:1.2;font-weight:800;text-wrap:balance}

.tarjeta{background:var(--tarjeta);border:1px solid var(--linea);border-radius:var(--radio);padding:16px;margin-bottom:12px;box-shadow:var(--sombra)}
.etq{display:block;font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--suave);margin-bottom:8px}
.nota{color:var(--suave);font-size:14px}

.segm{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.segm button{min-height:54px;border-radius:12px;border:1.5px solid var(--linea);background:#fff;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;padding:6px 10px}
.segm button[aria-pressed=true]{background:var(--vino);border-color:var(--vino);color:#fff}

input[type=text],input[type=password],input[type=search],select,textarea{width:100%;min-height:52px;padding:12px 14px;border-radius:12px;
  border:1.5px solid var(--linea);background:#fff;font-size:16px;font-weight:600;outline:none}
textarea{min-height:110px;resize:vertical;line-height:1.4;font-weight:500}
input:focus,select:focus,textarea:focus{border-color:var(--vino);box-shadow:0 0 0 3px var(--vino-suave)}
.mayus{text-transform:uppercase}
.mayus::placeholder{text-transform:none;font-weight:500}

.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;border-radius:14px;border:0;
  background:var(--vino);color:#fff;font-weight:800;font-size:16px;padding:10px 16px;text-align:center;transition:transform .1s,background .15s}
.btn:active{background:var(--vino-osc);transform:scale(.985)}
.btn[disabled]{opacity:.45}
.btn.sec{background:#fff;color:var(--vino);border:1.5px solid var(--vino-linea)}
.btn.sec:active{background:var(--vino-suave)}
.btn.chico{min-height:44px;font-size:14px;width:auto;padding:8px 14px}
.btn.plano{background:none;color:var(--suave);font-weight:700;min-height:46px;font-size:14px}
.btn.peligro{color:var(--rojo)}
.fila{display:flex;gap:10px}
.fila>*{flex:1}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.menu .btn{min-height:78px;flex-direction:column;gap:4px;font-size:14px}

.pie{position:fixed;left:0;right:0;bottom:0;z-index:6;background:linear-gradient(transparent,var(--fondo) 26%);
  padding:22px 16px calc(14px + env(safe-area-inset-bottom))}
.pie>div{max-width:608px;margin:0 auto}
.dos{display:grid;grid-template-columns:1fr 1.6fr;gap:8px}
.sig{font-size:12px;color:var(--suave);text-align:center;margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Listas */
.titulo-sec{display:flex;justify-content:space-between;align-items:baseline;margin:16px 2px 8px;gap:10px}
.titulo-sec h3{font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--suave)}
.titulo-sec span{font-size:12px;color:var(--suave)}
.item{display:flex;align-items:stretch;background:#fff;border:1px solid var(--linea);border-radius:14px;margin-bottom:8px;overflow:hidden;box-shadow:var(--sombra)}
.item>.cuerpo{flex:1;min-width:0;text-align:left;background:none;border:0;padding:12px 14px;min-height:58px;display:flex;align-items:center;gap:12px}
.item .nombre{font-weight:700;font-size:15px;overflow-wrap:anywhere}
.item .det{font-size:13px;color:var(--suave);overflow-wrap:anywhere}
.item .x{flex:none;width:48px;border:0;border-left:1px solid var(--linea);background:none;color:var(--suave);display:grid;place-items:center}
.item .chev{margin-left:auto;color:#b7aaaf}
.punto{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--vino-linea)}
.marca-ok,.marca-nov{flex:none;width:24px;height:24px;border-radius:50%;color:#fff;display:grid;place-items:center}
.marca-ok{background:var(--ok)}.marca-nov{background:var(--alerta)}
.marca-ok svg.i,.marca-nov svg.i{width:14px;height:14px;stroke-width:3}
.hora{flex:none;font-variant-numeric:tabular-nums;font-size:13px;color:var(--suave);white-space:nowrap}
.busca{position:relative;margin-bottom:4px}
.busca svg.i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--suave)}
.busca input{padding-left:44px;font-weight:500}
.plg{width:100%;display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--linea);border-radius:14px;padding:0 14px;min-height:54px;font-weight:700;font-size:15px;margin-top:8px;text-align:left}
.plg .chev{margin-left:auto;transition:transform .2s}
.plg[aria-expanded=true] .chev{transform:rotate(180deg)}

.reloj{display:flex;gap:8px;margin:14px 0 12px;font-variant-numeric:tabular-nums}
.reloj div{flex:1;background:var(--vino-suave);border-radius:12px;padding:8px 12px}
.reloj b{display:block;font-size:17px}
.reloj span{font-size:10px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--vino)}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{display:inline-flex;align-items:center;border:1.5px solid var(--vino-linea);background:#fff;border-radius:99px;font-weight:700;font-size:13px;overflow:hidden}
.chip button{background:none;border:0;padding:8px 12px;min-height:38px;font-weight:700}
.chip button+button{border-left:1px solid var(--vino-linea);color:var(--suave);padding:8px 9px;display:grid;place-items:center}
.chip button+button svg.i{width:14px;height:14px}
.chip.act{background:var(--vino);border-color:var(--vino);color:#fff}
.chip.act button+button{color:#fff;border-color:rgba(255,255,255,.3)}

/* Firma */
.firma-caja{position:relative}
.firma{position:relative;border:1.5px dashed var(--vino-linea);border-radius:12px;background:#fff;overflow:hidden}
.firma canvas{display:block;width:100%;aspect-ratio:8/3;touch-action:none}
.firma .guia{position:absolute;left:8%;right:8%;bottom:24%;border-bottom:1px solid var(--linea);pointer-events:none}
.firma .ayuda{position:absolute;inset:0;display:grid;place-items:center;color:#b9aeb2;font-size:14px;pointer-events:none}
.firma img{display:block;width:100%;aspect-ratio:8/3;object-fit:contain;padding:8px}
.amp{position:absolute;right:8px;top:8px;z-index:2;border:0;min-height:36px;padding:0 10px;border-radius:9px;background:var(--vino-suave);color:var(--vino);display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800}
.amp svg.i{width:15px;height:15px}
.firma-pie{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.capa-firma{position:fixed;inset:0;z-index:40;background:#fff;display:flex;flex-direction:column}
.capa-firma .hb{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:var(--vino);color:#fff;font-size:14px;font-weight:700}
.capa-firma .hb span:last-child{opacity:.8;font-weight:500;white-space:nowrap}
.capa-firma .zona{flex:1;margin:12px 16px;min-height:0}
.capa-firma .firma{height:100%}
.capa-firma .firma canvas{aspect-ratio:auto;height:100%}
.capa-firma .bb{display:flex;gap:8px;padding:0 16px calc(12px + env(safe-area-inset-bottom))}
.capa-firma .bb .btn{min-height:48px}
@media (orientation:portrait){.capa-firma .zona{flex:none;height:min(48vh,420px);margin-top:24px}}

/* Historial */
.pestanas{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:#ebe5e2;padding:4px;border-radius:12px;margin-bottom:10px}
.pestanas button{border:0;background:none;min-height:42px;border-radius:9px;font-weight:700;color:var(--suave)}
.pestanas button[aria-selected=true]{background:#fff;color:var(--vino);box-shadow:var(--sombra)}
.filtros{display:flex;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.filtro{position:relative;display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 12px;border-radius:99px;border:1.5px solid var(--linea);background:#fff;font-size:13px;font-weight:700;color:var(--tinta)}
.filtro.on{border-color:var(--vino);color:var(--vino);background:var(--vino-suave)}
.filtro svg.i{width:15px;height:15px}
.filtro select{position:absolute;inset:0;opacity:0;min-height:0;cursor:pointer}
.grupo{font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--suave);margin:14px 2px 8px}
.ronda-h{width:100%;display:flex;gap:12px;align-items:center;text-align:left;background:#fff;border:1px solid var(--linea);border-radius:14px;padding:12px 14px;margin-bottom:8px;box-shadow:var(--sombra)}
.ronda-h .d{width:46px;text-align:center;border-right:1px solid var(--linea);padding-right:10px;flex:none}
.ronda-h .d b{display:block;font-size:20px;line-height:1.1}
.ronda-h .d span{font-size:11px;font-weight:700;color:var(--suave)}
.ronda-h .n{font-weight:700;font-size:15px;overflow-wrap:anywhere}
.ronda-h .m{font-size:13px;color:var(--suave)}
.ronda-h .m b{color:var(--alerta);font-weight:700}
.tag{margin-left:auto;font-size:12px;font-weight:800;padding:4px 10px;border-radius:99px;display:flex;align-items:center;gap:4px;white-space:nowrap;flex:none}
.tag.tn{background:var(--alerta-suave);color:var(--alerta)}
.tag.ts{background:var(--ok-suave);color:var(--ok)}
.tag svg.i{width:13px;height:13px;stroke-width:2.6}
.sello{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;padding:4px 10px;border-radius:99px;background:var(--ok-suave);color:var(--ok);white-space:nowrap}
.sello.pend{background:var(--alerta-suave);color:var(--alerta)}
.sello svg.i{width:14px;height:14px}

.hoja{display:block;width:100%;border:1px solid var(--linea);border-radius:8px;margin-bottom:10px;background:#fff}
.vacio{text-align:center;color:var(--suave);padding:28px 12px;font-size:15px}
.aviso{background:var(--alerta-suave);color:#6b3505;border-radius:12px;padding:12px 14px;font-size:14px;margin-bottom:12px}
.resumen{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.resumen b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.resumen span{font-size:12px;color:var(--suave)}
.esp{height:14px}

dialog{border:0;border-radius:18px;padding:20px;width:min(92vw,420px);box-shadow:0 20px 60px rgba(0,0,0,.3);color:var(--tinta)}
dialog::backdrop{background:rgba(36,26,30,.5)}
dialog p{margin-bottom:16px;font-size:16px}
dialog input{margin-bottom:16px}
#toast{position:fixed;left:50%;top:calc(76px + env(safe-area-inset-top));transform:translateX(-50%);z-index:50;background:#241a1e;color:#fff;
  padding:12px 18px;border-radius:12px;font-size:14px;font-weight:600;max-width:88vw;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.ver{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

/* ============================ Utilidades ============================ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const MAY = s => String(s || '').toLocaleUpperCase('es').replace(/\s+/g, ' ').trim();
const p2 = n => String(n).padStart(2, '0');
const MESES = ['ENERO', 'FEBRERO', 'MARZO', 'ABRIL', 'MAYO', 'JUNIO', 'JULIO', 'AGOSTO', 'SEPTIEMBRE', 'OCTUBRE', 'NOVIEMBRE', 'DICIEMBRE'];
const fFecha = d => { d = new Date(d); return `${p2(d.getDate())}/${p2(d.getMonth() + 1)}/${d.getFullYear()}`; };

// Las rondas (con firmas) se guardan en IndexedDB: no tiene el límite de 5 MB de localStorage
const DB = {
  _p: null,
  abrir() {
    return this._p || (this._p = new Promise((res, rej) => {
      const r = indexedDB.open('ronda-gases', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('rondas', { keyPath: 'id' });
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    }));
  },
  async tx(modo, fn) {
    const db = await this.abrir();
    return new Promise((res, rej) => {
      const t = db.transaction('rondas', modo);
      const rq = fn(t.objectStore('rondas'));
      t.oncomplete = () => res(rq && rq.result);
      t.onerror = t.onabort = () => rej(t.error);
    });
  },
  todas() { return this.tx('readonly', s => s.getAll()); },
  guardar(r) { return this.tx('readwrite', s => s.put(r)); },
  borrar(id) { return this.tx('readwrite', s => s.delete(id)); }
};

/* ============================ Panel de firma ============================ */
class PanelFirma {
  constructor(cont) {
    this.cont = cont; this.trazos = []; this.actual = null;
    cont.innerHTML = `<canvas></canvas><div class="guia"></div><div class="ayuda">Firme aquí con el dedo o lápiz</div>`;
    this.cv = $('canvas', cont); this.ayuda = $('.ayuda', cont);
    const cv = this.cv;
    cv.addEventListener('pointerdown', e => {
      e.preventDefault(); cv.setPointerCapture(e.pointerId);
      this.actual = [this.pt(e)]; this.trazos.push(this.actual); this.ayuda.hidden = true; this.dibujar();
    });
    cv.addEventListener('pointermove', e => {
      if (!this.actual) return; e.preventDefault();
      const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
      for (const ev of (evs.length ? evs : [e])) this.actual.push(this.pt(ev));
      this.dibujar();
    });
    const fin = () => { this.actual = null; };
    cv.addEventListener('pointerup', fin); cv.addEventListener('pointercancel', fin);
    this.ro = new ResizeObserver(() => this.ajustar()); this.ro.observe(cv);
    this.ajustar();
  }
  pt(e) { const r = this.cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.width]; } // normalizado al ancho
  ajustar() {
    const r = this.cv.getBoundingClientRect(); if (!r.width) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    this.cv.width = Math.round(r.width * dpr); this.cv.height = Math.round(r.height * dpr); this.dibujar();
  }
  static trazar(x, trazos, esc, grosor, dx = 0, dy = 0) {
    x.lineCap = x.lineJoin = 'round'; x.strokeStyle = x.fillStyle = '#0d1b3e'; x.lineWidth = grosor;
    for (const t of trazos) {
      const P = t.map(p => [p[0] * esc - dx, p[1] * esc - dy]);
      if (P.length === 1) { x.beginPath(); x.arc(P[0][0], P[0][1], grosor / 2, 0, 7); x.fill(); continue; }
      x.beginPath(); x.moveTo(P[0][0], P[0][1]);
      for (let i = 1; i < P.length - 1; i++) x.quadraticCurveTo(P[i][0], P[i][1], (P[i][0] + P[i + 1][0]) / 2, (P[i][1] + P[i + 1][1]) / 2);
      x.lineTo(P[P.length - 1][0], P[P.length - 1][1]); x.stroke();
    }
  }
  dibujar() {
    const x = this.cv.getContext('2d'); x.clearRect(0, 0, this.cv.width, this.cv.height);
    PanelFirma.trazar(x, this.trazos, this.cv.width, this.cv.width / 150);
  }
  borrar() { this.trazos = []; this.actual = null; this.ayuda.hidden = false; this.dibujar(); }
  largo() {
    let l = 0; for (const t of this.trazos) for (let i = 1; i < t.length; i++) l += Math.hypot(t[i][0] - t[i - 1][0], t[i][1] - t[i - 1][1]);
    return l;
  }
  valida() { return this.largo() > 0.25; }   // descarta toques accidentales
  // PNG transparente, recortado al trazo, a buena resolución
  exportar() {
    const E = 1000, g = 7, m = 14;
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    for (const t of this.trazos) for (const p of t) { x0 = Math.min(x0, p[0] * E); x1 = Math.max(x1, p[0] * E); y0 = Math.min(y0, p[1] * E); y1 = Math.max(y1, p[1] * E); }
    x0 -= m; y0 -= m; x1 += m; y1 += m;
    const c = document.createElement('canvas'); c.width = Math.ceil(x1 - x0); c.height = Math.ceil(y1 - y0);
    PanelFirma.trazar(c.getContext('2d'), this.trazos, E, g, x0, y0);
    return c.toDataURL('image/png');
  }
  // Recibe trazos dibujados en la firma ampliada y los acomoda dentro de este recuadro
  ponerTrazos(tr) {
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    for (const t of tr) for (const p of t) { x0 = Math.min(x0, p[0]); x1 = Math.max(x1, p[0]); y0 = Math.min(y0, p[1]); y1 = Math.max(y1, p[1]); }
    const W = 1, H = 3 / 8, pad = 0.05, bw = Math.max(x1 - x0, 1e-3), bh = Math.max(y1 - y0, 1e-3);
    const e = Math.min((W - 2 * pad) / bw, (H - 2 * pad) / bh);
    const ox = (W - bw * e) / 2, oy = (H - bh * e) / 2;
    this.trazos = tr.map(t => t.map(p => [ox + (p[0] - x0) * e, oy + (p[1] - y0) * e]));
    this.ayuda.hidden = true; this.dibujar();
  }
  // El largo mínimo se mide relativo al tamaño del trazo, para que sirva igual en la firma ampliada
  destruir() { this.ro.disconnect(); }
}

/* ============================== Servidor ============================== */
async function api(accion, datos = {}, espera = 90000) {
  if (!apiLista()) throw new Error('La app aún no está conectada a la hoja de Google.');
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), espera);
  try {
    // text/plain evita la verificación CORS previa que Apps Script no responde
    const r = await fetch(CONFIG.API_URL, {
      method: 'POST', redirect: 'follow', signal: ctl.signal,
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ accion, codigo: ajustes.codigo, ...datos })
    });
    const txt = await r.text(); let j;
    try { j = JSON.parse(txt); } catch { throw new Error('El servidor respondió algo inesperado. Intenta de nuevo.'); }
    if (!j.ok) { const e = new Error(j.error || 'Error del servidor'); e.tipo = j.tipo; throw e; }
    return j;
  } finally { clearTimeout(t); }
}

async function cargarConfig() {
  if (!apiLista() || !navigator.onLine || !ajustes.codigo) return;
  try {
    const j = await api('config', {}, 30000);
    if (j.tecnicos) { tecnicos = j.tecnicos; LS.set('tecnicos', tecnicos); }
    // Mezcla lo que otros teléfonos ya han usado (sin revivir lo que aquí se ocultó)
    for (const sede of CONFIG.SEDES) {
      const s = (j.memoria || {})[sede]; if (!s) continue;
      const m = mem(sede);
      for (const n of s.servicios || []) if (!m.servicios.includes(n) && !m.ocultos.includes(n)) m.servicios.push(n);
      for (const [srv, lista] of Object.entries(s.jefes || {})) {
        const l = m.jefes[srv] || (m.jefes[srv] = []);
        for (const n of lista) if (!l.includes(n) && !m.ocultos.includes(srv + '|' + n)) l.push(n);
      }
    }
    guardarMemoria();
    if (actual.v === 'inicio') pintar();
  } catch (e) { if (e.tipo === 'ACCESO') pedirCodigo(true); }
}

let pidiendoCodigo = false;
async function pedirCodigo(invalido = false) {
  if (pidiendoCodigo) return false;
  pidiendoCodigo = true;
  let v;
  try { v = await pedirTextoCodigo(invalido); } finally { pidiendoCodigo = false; }
  if (v == null || !v.trim()) return false;
  ajustes.codigo = v.trim(); guardarAjustes();
  // Primero se valida el código; solo si sirve se intenta subir
  cargarConfig().then(() => { if (!pidiendoCodigo) sincronizar(); });
  return true;
}
function pedirTextoCodigo(invalido) {
  return pedir(invalido ? 'El código de acceso no es válido. Escríbelo de nuevo:' : 'Código de acceso de la app (te lo da el administrador):', { tipo: 'password', si: 'Continuar' });
}

const cabecera = r => ({
  id: r.id, sede: r.sede, tecnico: r.tecnico, inicio: r.inicio, fin: r.fin,
  servicios: r.registros.length, novedades: conNovedad(r), paginas: totalPaginas(r)
});

// Sube las rondas finalizadas. Va por partes pequeñas y recuerda lo ya subido,
// así una señal que se cae a mitad de camino no obliga a empezar de cero.
async function sincronizar() {
  if (sincronizando || !apiLista() || !navigator.onLine || !ajustes.codigo) return;
  const cola = pendientesSubir(); if (!cola.length) return;
  sincronizando = true; ultimoErrorSync = ''; pintarEstado();
  try {
    for (const r of cola) {
      const s = r.sync || (r.sync = { cab: false, regs: {}, pags: {} });
      const faltan = r.registros.filter(x => !s.regs[x.id]);
      if (!s.cab || faltan.length) {
        for (let i = 0; i === 0 || i < faltan.length; i += 5) {
          const lote = faltan.slice(i, i + 5);
          await api('registrar', { ronda: cabecera(r), firmaTecnico: s.cab ? null : r.firmaTecnico, registros: lote });
          s.cab = true; lote.forEach(x => s.regs[x.id] = true); await guardarRonda(r);
        }
      }
      const total = totalPaginas(r);
      for (let n = 0; n < total; n++) {
        if (s.pags[n]) continue;
        const jpg = await paginaDataURL(r, n);
        await api('reporte', { rondaId: r.id, pagina: n + 1, total, jpg }, 180000);
        s.pags[n] = true; await guardarRonda(r);
      }
      await api('cerrar', { ronda: cabecera(r) });
      r.subida = new Date().toISOString(); await guardarRonda(r);
      pintarEstado();
    }
    toast('Rondas subidas a la hoja de Google');
  } catch (e) {
    ultimoErrorSync = e.name === 'AbortError' ? 'La conexión está muy lenta' : (e.message || 'Sin conexión');
    if (e.tipo === 'ACCESO') pedirCodigo(true);
  } finally {
    sincronizando = false; pintarEstado();
    if (['historial', 'detalle'].includes(actual.v)) pintar();
  }
}

function textoEstado() {
  const n = pendientesSubir().length;
  if (!apiLista()) return ['off', n ? `${n} ronda(s) guardadas solo en este teléfono` : 'Modo local: falta conectar la hoja de Google', 'nube'];
  if (sincronizando) return ['sub', 'Subiendo rondas a la hoja de Google…', 'subir'];
  if (!navigator.onLine) return ['off', n ? `Sin señal · ${n} ronda(s) esperando para subir` : 'Sin señal · todo queda guardado en el teléfono', 'sinred'];
  if (!ajustes.codigo) return ['sub', 'Falta el código de acceso', 'alerta'];
  if (n) return ['sub', `${n} ronda(s) por subir${ultimoErrorSync ? ' · ' + ultimoErrorSync : ''}`, 'subir'];
  return ['', 'Todo subido a la hoja de Google', 'check'];
}
function pintarEstado() {
  const el = $('#estado'); if (!el) return;
  const [c, t, i] = textoEstado();
  el.className = 'franja ' + c + (el.dataset.arriba ? ' arriba' : '');
  el.innerHTML = `${ic(i)}<span>${esc(t)}</span>` +
    (apiLista() && navigator.onLine && pendientesSubir().length && !sincronizando ? `<button id="bSync">Subir ahora</button>` : '');
  const b = $('#bSync'); if (b) b.onclick = () => ajustes.codigo ? sincronizar() : pedirCodigo();
}
const franja = (arriba = false) => `<div id="estado" class="franja" ${arriba ? 'data-arriba="1"' : ''}></div>`;
const vibrar = () => { try { navigator.vibrate && navigator.vibrate(35); } catch { } };

/* ============================ Vista: inicio ============================ */

  const sede = ajustes.sede;
  const lista = tecnicos[sede] || [];
  const tec = lista.includes(ajustes.tecnico[sede]) ? ajustes.tecnico[sede] : (lista[0] || '');
  const ab = rondaAbierta(sede);
  app.innerHTML = `
    ${franja(true)}
    <header class="marca"><img src="${LOGO}" alt="Clínica Reina Catalina">
      <div><small>Clínica Reina Catalina</small><h1>Ronda diaria · Tomas de gases medicinales</h1></div></header>

    <div class="tarjeta">
      <span class="etq">Sede</span>
      <div class="segm">${CONFIG.SEDES.map(s => `<button data-sede="${esc(s)}" aria-pressed="${s === sede}">${ic('sede')}${esc(s)}</button>`).join('')}</div>
      <label class="etq" for="selTec" style="margin-top:14px">Técnico</label>
      <select id="selTec" ${ab ? 'disabled' : ''}>${(ab ? [ab.tecnico] : lista).map(t => `<option ${t === (ab ? ab.tecnico : tec) ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select>
    </div>

    ${ab ? `<button class="btn" id="bRonda">${ic('ronda')}Continuar ronda · ${ab.registros.length} servicio(s)</button>
            <p class="nota" style="text-align:center;margin-top:8px">Ronda abierta el ${fFecha(ab.inicio)} a las ${fHora(ab.inicio)}</p>`
         : `<button class="btn" id="bRonda" ${lista.length ? '' : 'disabled'}>${ic('ronda')}Iniciar ronda de ${esc(sede)}</button>`}

    <div class="menu">
      <button class="btn sec" id="bHist">${ic('historial')}Historial</button>
      <button class="btn sec" id="bAjus">${ic('ajustes')}Ajustes</button>
    </div>
    ${eventoInstalar ? `<button class="btn sec" id="bInst" style="margin-top:10px">${ic('instalar')}Instalar la app en este teléfono</button>` : ''}
    <p class="nota" style="text-align:center;margin-top:20px;font-size:12px">${esc(CONFIG.FORMATO.codigo)} · Versión ${esc(CONFIG.FORMATO.version)} · App ${CONFIG.VERSION_APP}</p>`;

  $$('[data-sede]').forEach(b => b.onclick = () => { ajustes.sede = b.dataset.sede; guardarAjustes(); pintar(); });
  $('#selTec').onchange = e => { ajustes.tecnico[sede] = e.target.value; guardarAjustes(); };
  $('#bRonda').onclick = async () => {
    if (ab) return ir('ronda', { id: ab.id });
    const ahora = new Date();
    const r = {
      id: `${CONFIG.PREFIJO[sede] || 'RND'}-${fDiaISO(ahora).replace(/-/g, '')}-${p2(ahora.getHours())}${p2(ahora.getMinutes())}-${azar(3)}`,
      sede, tecnico: $('#selTec').value, inicio: ahora.toISOString(), fin: null, estado: 'abierta', subida: null, firmaTecnico: null, registros: []
    };
    ajustes.tecnico[sede] = r.tecnico; guardarAjustes();
    await guardarRonda(r); ir('ronda', { id: r.id });
  };
  $('#bHist').onclick = () => ir('historial', { sede });
  $('#bAjus').onclick = () => ir('ajustes');
  const bi = $('#bInst'); if (bi) bi.onclick = async () => { eventoInstalar.prompt(); await eventoInstalar.userChoice; eventoInstalar = null; pintar(); };
  pintarEstado();
};

/* ============================ Vista: ronda ============================ */
function serviciosPendientes(r) {
  const m = mem(r.sede); const hechos = new Set(r.registros.map(x => x.servicio));
  return m.servicios.filter(s => !hechos.has(s) && !m.ocultos.includes(s));
}
let verRegistrados = false;
const filaRegistro = x => `<div class="item"><button class="cuerpo" data-reg="${x.id}">
    ${x.novedad === SIN_NOVEDAD ? `<i class="marca-ok">${ic('check')}</i>` : `<i class="marca-nov">${ic('exclam')}</i>`}
    <span style="flex:1;min-width:0"><span class="nombre">${esc(x.servicio)}</span><br>
      <span class="det">${esc(x.novedad)} · Recibe: ${esc(x.jefe)}</span></span>
    <span class="hora">${fHora(x.ts)}</span></button></div>`;

vistas.ronda = ({ id }) => {
  const r = rondaPorId(id);
  if (!r || r.estado !== 'abierta') return ir('inicio', {}, true);
  const pend = serviciosPendientes(r), hechos = r.registros, total = pend.length + hechos.length;
  const nNov = conNovedad(r);
  app.innerHTML = `
    ${barra('Ronda · ' + r.sede, `${fFecha(r.inicio)} · ${r.tecnico}`,
      `<div class="av"><span>${hechos.length} de ${total} servicios</span><span>${pend.length ? pend.length + ' pendientes' : (total ? 'Completo' : '')}</span></div>
       <div class="bar"><i style="width:${total ? Math.round(hechos.length / total * 100) : 0}%"></i></div>`)}
    ${franja()}
    ${pend.length > 4 ? `<div class="busca">${ic('buscar')}<input type="search" id="qSrv" class="mayus" placeholder="Buscar servicio…" autocomplete="off" autocapitalize="characters" spellcheck="false"></div>` : ''}
    ${pend.length ? `<div class="titulo-sec"><h3>Pendientes</h3><span>en el orden de la última ronda</span></div>` : ''}
    <div id="listaPend">${pend.map(s => `<div class="item" data-nombre="${esc(s)}"><button class="cuerpo" data-srv="${esc(s)}"><i class="punto"></i><span class="nombre">${esc(s)}</span>${ic('der', 'chev')}</button></div>`).join('')}</div>
    <div id="sinRes" class="vacio" hidden></div>
    ${!total ? `<div class="vacio">Aún no hay servicios guardados para ${esc(r.sede)}.<br>Agrega el primero; en la próxima ronda la app ya los recordará.</div>` : ''}
    <button class="btn sec" id="bNuevo" style="margin-top:4px">${ic('mas')}${total ? 'Otro servicio' : 'Agregar servicio'}</button>

    ${hechos.length ? `<button class="plg" id="bPlg" aria-expanded="${verRegistrados}"><i class="marca-ok">${ic('check')}</i>
        <span>Registrados (${hechos.length})${nNov ? ` · ${nNov} con novedad` : ''}</span>${ic('abajo', 'chev')}</button>
      <div id="listaReg" ${verRegistrados ? '' : 'hidden'} style="margin-top:8px">${[...hechos].reverse().map(filaRegistro).join('')}</div>` : ''}

    <button class="btn plano peligro" id="bDesc" style="margin-top:16px">${ic('basura')}Descartar esta ronda</button>
    <div class="pie"><div><button class="btn" id="bFin" ${hechos.length ? '' : 'disabled'}>Finalizar ronda</button></div></div>`;
  activarAtras(); pintarEstado();
  $$('[data-srv]').forEach(b => b.onclick = () => ir('servicio', { id, servicio: b.dataset.srv }));
  $$('[data-reg]').forEach(b => b.onclick = () => ir('servicio', { id, reg: b.dataset.reg }));
  const q = $('#qSrv');
  if (q) {
    soloMayusculas(q);
    q.addEventListener('input', () => {
      const t = MAY(q.value); let vis = 0;
      $$('#listaPend .item').forEach(it => { const ok = !t || it.dataset.nombre.includes(t); it.hidden = !ok; if (ok) vis++; });
      const sr = $('#sinRes'); sr.hidden = vis > 0 || !t;
      sr.innerHTML = vis || !t ? '' : `No está en los pendientes.<br><button class="btn sec chico" id="bNuevoQ" style="margin:10px auto 0">${ic('mas')}Registrar “${esc(t)}”</button>`;
      const bq = $('#bNuevoQ'); if (bq) bq.onclick = () => ir('servicio', { id, nuevo: t });
    });
  }
  const pl = $('#bPlg'); if (pl) pl.onclick = () => {
    verRegistrados = !verRegistrados; pl.setAttribute('aria-expanded', verRegistrados); $('#listaReg').hidden = !verRegistrados;
  };
  $('#bNuevo').onclick = () => ir('servicio', { id });
  $('#bFin').onclick = () => ir('finalizar', { id });
  $('#bDesc').onclick = async () => {
    if (!await preguntar('Se borrará esta ronda y todo lo registrado en ella. No se puede deshacer.', 'Descartar', 'Cancelar', true)) return;
    rondas = rondas.filter(x => x !== r); await DB.borrar(r.id); ir('inicio', {}, true);
  };
};

/* ===================== Firma ampliada (pantalla completa) ===================== */
function firmaGrande(titulo) {
  return new Promise(res => {
    const capa = document.createElement('div'); capa.className = 'capa-firma';
    capa.innerHTML = `<div class="hb"><span>${esc(titulo)}</span><span id="giro">Gire el teléfono</span></div>
      <div class="zona"><div class="firma" id="fGrande"></div></div>
      <div class="bb"><button class="btn sec" data-a="no">Cancelar</button><button class="btn sec" data-a="borrar">Borrar</button><button class="btn" data-a="ok">Listo</button></div>`;
    document.body.appendChild(capa);
    const panel = new PanelFirma($('#fGrande', capa));
    const giro = () => { const g = $('#giro', capa); if (g) g.hidden = innerWidth > innerHeight; };
    giro(); addEventListener('resize', giro);
    // Intenta girar a horizontal sin pasar a pantalla completa (la pantalla completa muestra un aviso
    // del navegador que tapaba los botones). Si el teléfono no lo permite, se gira a mano.
    try { const o = screen.orientation; if (o && o.lock) o.lock('landscape').catch(() => { }); } catch { }
    const cerrar = v => {
      removeEventListener('resize', giro); panel.destruir();
      try { if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); } catch { }
      capa.remove(); res(v);
    };
    $$('[data-a]', capa).forEach(b => b.onclick = () => {
      if (b.dataset.a === 'borrar') return panel.borrar();
      if (b.dataset.a === 'no') return cerrar(null);
      if (!panel.valida()) return toast('Falta la firma');
      cerrar(panel.trazos);
    });
  });
}

/* ========================== Vista: servicio ========================== */
vistas.servicio = ({ id, servicio, reg, nuevo }) => {
  const r = rondaPorId(id);
  if (!r || r.estado !== 'abierta') return ir('inicio', {}, true);
  const m = mem(r.sede);
  const ed = reg ? r.registros.find(x => x.id === reg) : null;
  if (reg && !ed) return ir('ronda', { id }, true);
  const fijo = !!(servicio && !ed);                   // viene de la lista de pendientes
  const srvIni = ed ? ed.servicio : (servicio || nuevo || '');
  let tipoNov = ed ? (ed.novedad === SIN_NOVEDAD ? 'sin' : 'con') : '';
  let firmaPrev = ed ? ed.firmaJefe : null;
  let panel = null;
  const totalSrv = serviciosPendientes(r).length + r.registros.length + (fijo || ed ? 0 : 1);
  const siguienteDe = actualSrv => serviciosPendientes(r).filter(s => s !== actualSrv)[0] || '';
  const sig = ed ? '' : siguienteDe(MAY(srvIni));

  app.innerHTML = `
    ${barra(ed ? 'Corregir servicio' : (fijo ? servicio : 'Nuevo servicio'),
      ed ? `${ed.servicio} · ${r.sede}` : `Servicio ${r.registros.length + 1} de ${totalSrv} · ${r.sede}`)}
    <div class="reloj"><div><span>Día</span><b id="rDia"></b></div><div><span>Hora</span><b id="rHora"></b></div></div>

    ${fijo ? `<input type="hidden" id="iSrv" value="${esc(srvIni)}">` : `<div class="tarjeta">
      <label class="etq" for="iSrv">Servicio</label>
      <input type="text" id="iSrv" class="mayus" maxlength="40" autocomplete="off" autocapitalize="characters" spellcheck="false"
             placeholder="Ej.: UCI 1, PEDIATRÍA, PISO 4 LADO C" value="${esc(srvIni)}">
      <div class="chips" id="sug"></div></div>`}

    <div class="tarjeta">
      <span class="etq">Novedad</span>
      <div class="segm"><button id="nSin" aria-pressed="false">${ic('check')}SIN NOVEDAD</button><button id="nCon" aria-pressed="false">${ic('alerta')}Con novedad</button></div>
      <textarea id="iNov" maxlength="220" placeholder="Describe la novedad encontrada" style="margin-top:10px" hidden>${ed && tipoNov === 'con' ? esc(ed.novedad) : ''}</textarea>
    </div>

    <div class="tarjeta">
      <label class="etq" for="iJefe">Jefe de servicio (o quien lo suple)</label>
      <input type="text" id="iJefe" class="mayus" maxlength="45" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Nombre de quien firma">
      <div class="chips" id="jefes"></div>
      <span class="etq" style="margin-top:14px">Firma de quien recibe</span>
      <div class="firma-caja"><div class="firma" id="cFirma"></div><button class="amp" id="bAmp">${ic('ampliar')}Ampliar</button></div>
      <div class="firma-pie"><span class="nota" id="notaFirma"></span><button class="btn plano chico" id="bBorrar">Borrar firma</button></div>
    </div>
    ${ed ? `<button class="btn plano peligro" id="bElim">${ic('basura')}Eliminar este registro</button>` : ''}

    <div class="pie"><div>${sig
      ? `<div class="dos"><button class="btn sec" id="bGuardar">Guardar</button><button class="btn" id="bSig">Guardar y siguiente${ic('flecha')}</button></div>
         <p class="sig">Siguiente: ${esc(sig)}</p>`
      : `<button class="btn" id="bGuardar">${ed ? 'Guardar cambios' : 'Guardar servicio'}</button>`}</div></div>`;
  activarAtras();

  const iSrv = $('#iSrv'), iJefe = $('#iJefe'), iNov = $('#iNov');
  soloMayusculas(iSrv); soloMayusculas(iJefe);
  const tic = () => { const d = new Date(); $('#rDia').textContent = fFecha(d); $('#rHora').textContent = fHora(d); };
  tic(); const reloj = setInterval(tic, 15000);

  const pintarNov = () => {
    $('#nSin').setAttribute('aria-pressed', tipoNov === 'sin'); $('#nCon').setAttribute('aria-pressed', tipoNov === 'con');
    iNov.hidden = tipoNov !== 'con';
  };
  $('#nSin').onclick = () => { tipoNov = 'sin'; pintarNov(); };
  $('#nCon').onclick = () => { tipoNov = 'con'; pintarNov(); iNov.focus(); };
  pintarNov();

  const pintarSug = () => {
    const cont = $('#sug'); if (!cont) return;
    const q = MAY(iSrv.value); const hechos = new Set(r.registros.map(x => x.servicio));
    const ops = (q && !m.servicios.includes(q)) ? m.servicios.filter(s => s.includes(q) && !hechos.has(s)).slice(0, 6) : [];
    cont.innerHTML = ops.map(s => `<span class="chip"><button data-s="${esc(s)}">${esc(s)}</button></span>`).join('');
    $$('#sug [data-s]').forEach(b => b.onclick = () => { iSrv.value = b.dataset.s; pintarSug(); pintarJefes(true); });
  };
  iSrv.addEventListener('input', pintarSug);
  iSrv.addEventListener('blur', () => pintarJefes(!iJefe.value));

  function pintarJefes(prellenar) {
    const srv = MAY(iSrv.value); const lista = m.jefes[srv] || [];
    if (prellenar && lista.length && !iJefe.value) iJefe.value = lista[0];
    const sel = MAY(iJefe.value);
    $('#jefes').innerHTML = lista.map(n => `<span class="chip ${n === sel ? 'act' : ''}"><button data-j="${esc(n)}">${esc(n)}</button><button data-jx="${esc(n)}" aria-label="Olvidar a ${esc(n)}">${ic('x')}</button></span>`).join('');
    $$('#jefes [data-j]').forEach(b => b.onclick = () => { iJefe.value = b.dataset.j; pintarJefes(false); });
    $$('#jefes [data-jx]').forEach(b => b.onclick = () => {
      const n = b.dataset.jx; m.jefes[srv] = lista.filter(x => x !== n); m.ocultos.push(srv + '|' + n); guardarMemoria();
      if (MAY(iJefe.value) === n) iJefe.value = ''; pintarJefes(false);
    });
  }
  iJefe.addEventListener('input', () => pintarJefes(false));
  if (ed) iJefe.value = ed.jefe;
  pintarJefes(!ed);

  const cF = $('#cFirma');
  const ponerPanel = () => {
    if (panel) return; firmaPrev = null; panel = new PanelFirma(cF);
    $('#notaFirma').textContent = ''; $('#bBorrar').textContent = 'Borrar firma';
  };
  if (firmaPrev) {
    cF.innerHTML = `<img src="${firmaPrev}" alt="Firma guardada">`;
    $('#notaFirma').textContent = 'Firma ya guardada'; $('#bBorrar').textContent = 'Volver a firmar';
  } else ponerPanel();
  $('#bBorrar').onclick = () => { if (panel) panel.borrar(); else ponerPanel(); };
  $('#bAmp').onclick = async () => {
    const t = await firmaGrande(`Firma · ${MAY(iJefe.value) || 'quien recibe'} · ${MAY(iSrv.value) || 'servicio'}`);
    if (t) { ponerPanel(); panel.ponerTrazos(t); }
  };

  alSalir = () => { clearInterval(reloj); if (panel) panel.destruir(); };

  async function guardar() {
    const srv = MAY(iSrv.value), jefe = MAY(iJefe.value);
    const nov = tipoNov === 'sin' ? SIN_NOVEDAD : iNov.value.replace(/\s+/g, ' ').trim();
    if (!srv) { toast('Escribe el servicio'); iSrv.focus(); return false; }
    if (!tipoNov) { toast('Marca SIN NOVEDAD o Con novedad'); return false; }
    if (tipoNov === 'con' && !nov) { toast('Describe la novedad'); iNov.focus(); return false; }
    if (!jefe) { toast('Escribe el nombre de quien firma'); iJefe.focus(); return false; }
    const cambio = ed && (ed.servicio !== srv || ed.novedad !== nov || ed.jefe !== jefe);
    if (firmaPrev && cambio) { ponerPanel(); toast('Cambiaste los datos: quien recibe debe firmar de nuevo', 3600); return false; }
    if (!firmaPrev && !panel.valida()) { toast('Falta la firma de quien recibe'); return false; }
    const repetido = r.registros.find(x => x.servicio === srv && x !== ed);
    if (repetido && !await preguntar(`"${srv}" ya está registrado en esta ronda (${fHora(repetido.ts)}). ¿Registrarlo otra vez?`, 'Sí, registrar', 'No')) return false;

    const datos = { servicio: srv, novedad: nov, jefe, firmaJefe: firmaPrev || panel.exportar() };
    if (ed) { Object.assign(ed, datos); if (!firmaPrev) ed.ts = new Date().toISOString(); }
    else r.registros.push({ id: `${r.id}-${p2(r.registros.length + 1)}${azar(2)}`, ts: new Date().toISOString(), ...datos });

    if (!m.servicios.includes(srv)) m.servicios.push(srv);
    m.ocultos = m.ocultos.filter(o => o !== srv && o !== srv + '|' + jefe);
    m.jefes[srv] = [jefe, ...(m.jefes[srv] || []).filter(n => n !== jefe)].slice(0, 6);
    guardarMemoria(); await guardarRonda(r);
    vibrar(); toast(`${srv} guardado`);
    return true;
  }
  $('#bGuardar').onclick = async () => { if (await guardar()) atras(); };
  const bs = $('#bSig'); if (bs) bs.onclick = async () => {
    if (!await guardar()) return;
    const prox = serviciosPendientes(r)[0];
    if (prox) ir('servicio', { id, servicio: prox }, true); else atras();
  };
  const be = $('#bElim'); if (be) be.onclick = async () => {
    if (!await preguntar(`¿Eliminar el registro de "${ed.servicio}"?`, 'Eliminar', 'Cancelar', true)) return;
    r.registros = r.registros.filter(x => x !== ed); await guardarRonda(r); atras();
  };
  if (!srvIni && !fijo) iSrv.focus();
};

/* ========================== Vista: finalizar ========================== */
vistas.finalizar = ({ id }) => {
  const r = rondaPorId(id);
  if (!r || r.estado !== 'abierta' || !r.registros.length) return ir('inicio', {}, true);
  const pend = serviciosPendientes(r);
  const lista = [...new Set([r.tecnico, ...(tecnicos[r.sede] || [])])];
  app.innerHTML = `
    ${barra('Finalizar ronda', `${r.sede} · ${fFecha(r.inicio)}`)}
    <div class="esp"></div>
    <div class="tarjeta resumen">
      <div><b>${r.registros.length}</b><span>servicios</span></div>
      <div><b>${conNovedad(r)}</b><span>con novedad</span></div>
      <div><b>${totalPaginas(r)}</b><span>hoja(s) JPG</span></div>
    </div>
    ${pend.length ? `<div class="aviso"><b>Quedan ${pend.length} servicio(s) habituales sin registrar:</b> ${esc(pend.join(', '))}. Puedes volver y registrarlos, o finalizar así.</div>` : ''}
    <div class="tarjeta">
      <label class="etq" for="selTecF">Técnico</label>
      <select id="selTecF">${lista.map(t => `<option ${t === r.tecnico ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select>
      <span class="etq" style="margin-top:14px">Firma del técnico</span>
      <div class="firma-caja"><div class="firma" id="cFirma"></div><button class="amp" id="bAmp">${ic('ampliar')}Ampliar</button></div>
      <div class="firma-pie"><span class="nota">Se aplica a todos los servicios</span><button class="btn plano chico" id="bBorrar">Borrar firma</button></div>
    </div>
    <p class="nota" style="text-align:center">Al finalizar, la ronda queda cerrada y ya no se puede modificar.</p>
    <div class="pie"><div><button class="btn" id="bCerrar">${ic('check')}Finalizar y generar reporte</button></div></div>`;
  activarAtras();
  const panel = new PanelFirma($('#cFirma'));
  alSalir = () => panel.destruir();
  $('#bBorrar').onclick = () => panel.borrar();
  $('#bAmp').onclick = async () => { const t = await firmaGrande(`Firma del técnico · ${$('#selTecF').value}`); if (t) panel.ponerTrazos(t); };
  $('#bCerrar').onclick = async () => {
    if (!panel.valida()) return toast('Falta la firma del técnico');
    r.tecnico = $('#selTecF').value; r.firmaTecnico = panel.exportar();
    r.fin = new Date().toISOString(); r.estado = 'finalizada'; r.sync = { cab: false, regs: {}, pags: {} };
    const m = mem(r.sede); const hoy = [...new Set(r.registros.map(x => x.servicio))];
    m.servicios = [...hoy, ...m.servicios.filter(s => !hoy.includes(s))]; guardarMemoria();
    await guardarRonda(r); vibrar();
    ir('detalle', { id: r.id, recien: true }, true);
    sincronizar();
  };
};

/* ============================ Reporte JPG ============================ */
const _img = new Map();
function cargarImg(src) {
  if (!src) return Promise.resolve(null);
  if (!_img.has(src)) _img.set(src, new Promise(res => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = src; }));
  return _img.get(src);
}
function partir(x, txt, maxW) {
  const out = []; let l = '';
  for (let pal of String(txt).split(/\s+/)) {
    while (x.measureText(pal).width > maxW && pal.length > 1) {     // palabra más ancha que la celda
      let n = pal.length; while (n > 1 && x.measureText((l ? l + ' ' : '') + pal.slice(0, n)).width > maxW) n--;
      if (l && x.measureText(l + ' ' + pal.slice(0, n)).width <= maxW) { out.push(l + ' ' + pal.slice(0, n)); l = ''; }
      else { if (l) out.push(l); out.push(pal.slice(0, n)); l = ''; }
      pal = pal.slice(n);
    }
    const p = l ? l + ' ' + pal : pal;
    if (x.measureText(p).width <= maxW) l = p; else { if (l) out.push(l); l = pal; }
  }
  if (l) out.push(l); return out;
}
// Texto en una caja: reduce la letra hasta que quepa; si aun así no cabe, corta con "…"
function textoCaja(x, txt, bx, by, bw, bh, { max = 40, min = 22, bold = false, align = 'center', color = '#111', lineas = 3, pad = 18 } = {}) {
  let size = max, L;
  for (; ; size -= 2) {
    x.font = `${bold ? '700 ' : ''}${size}px Arial, Helvetica, sans-serif`;
    L = partir(x, txt, bw - pad * 2);
    if ((L.length <= lineas && L.length * size * 1.18 <= bh - 8) || size <= min) break;
  }
  const cab = Math.max(1, Math.min(lineas, Math.floor((bh - 8) / (size * 1.18))));
  if (L.length > cab) { L = L.slice(0, cab); let u = L[cab - 1]; while (u.length > 1 && x.measureText(u + '…').width > bw - pad * 2) u = u.slice(0, -1); L[cab - 1] = u + '…'; }
  x.fillStyle = color; x.textAlign = align; x.textBaseline = 'middle';
  const lh = size * 1.18, y0 = by + bh / 2 - (L.length - 1) * lh / 2;
  const tx = align === 'center' ? bx + bw / 2 : align === 'right' ? bx + bw - pad : bx + pad;
  L.forEach((l, i) => x.fillText(l, tx, y0 + i * lh));
}
function imgEnCaja(x, img, bx, by, bw, bh) {
  if (!img) return;
  const e = Math.min(bw / img.width, bh / img.height), w = img.width * e, h = img.height * e;
  x.drawImage(img, bx + (bw - w) / 2, by + (bh - h) / 2, w, h);
}

// Hoja carta horizontal a 300 ppp (3300 × 2550 px), igual de proporción al formato físico
async function renderPagina(r, n) {
  const W = 3300, H = 2550, M = 110, AN = W - 2 * M, F = CONFIG.FORMATO, FP = CONFIG.FILAS_POR_PAGINA;
  const VINO = '#651037', LIN = '#1a1a1a';
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d');
  x.fillStyle = '#fff'; x.fillRect(0, 0, W, H);
  x.strokeStyle = LIN; x.lineWidth = 4;

  // --- Encabezado: logo | nombre del formato | código, versión, fecha, página
  const hY = M, hH = 330, wLogo = 520, wCod = 800, xTit = M + wLogo, xCod = M + AN - wCod;
  x.strokeRect(M, hY, AN, hH);
  x.beginPath(); x.moveTo(xTit, hY); x.lineTo(xTit, hY + hH); x.moveTo(xCod, hY); x.lineTo(xCod, hY + hH); x.stroke();
  imgEnCaja(x, await cargarImg(LOGO), M + 20, hY + 22, wLogo - 40, hH - 44);
  textoCaja(x, F.nombre, xTit, hY, xCod - xTit, hH, { max: 60, min: 40, bold: true, lineas: 2, pad: 50 });
  const filasCod = [['CÓDIGO', F.codigo], ['VERSIÓN', F.version], ['FECHA', F.fecha], ['PÁGINA', `${n + 1} DE ${totalPaginas(r)}`]];
  const hC = hH / 4, wEt = 300;
  x.fillStyle = '#f3eef0'; x.fillRect(xCod + 2, hY + 2, wEt - 2, hH - 4);
  x.lineWidth = 3; x.beginPath(); x.moveTo(xCod + wEt, hY); x.lineTo(xCod + wEt, hY + hH);
  for (let i = 1; i < 4; i++) { x.moveTo(xCod, hY + i * hC); x.lineTo(M + AN, hY + i * hC); } x.stroke();
  filasCod.forEach(([e, v], i) => {
    textoCaja(x, e, xCod, hY + i * hC, wEt, hC, { max: 38, bold: true, align: 'left', lineas: 1, color: '#333' });
    textoCaja(x, v, xCod + wEt, hY + i * hC, wCod - wEt, hC, { max: 40, align: 'right', lineas: 1 });
  });

  // --- Datos de la ronda
  const d0 = new Date(r.inicio), iY = hY + hH + 30, iH = 90;
  const dato = (et, val, bx, bw, align) => {
    x.font = '700 40px Arial, Helvetica, sans-serif'; const wE = x.measureText(et + '  ').width;
    x.font = '42px Arial, Helvetica, sans-serif'; const wV = x.measureText(val).width;
    let tx = align === 'left' ? bx : align === 'right' ? bx + bw - wE - wV : bx + (bw - wE - wV) / 2;
    x.textAlign = 'left'; x.textBaseline = 'middle';
    x.font = '700 40px Arial, Helvetica, sans-serif'; x.fillStyle = VINO; x.fillText(et, tx, iY + iH / 2);
    x.font = '42px Arial, Helvetica, sans-serif'; x.fillStyle = '#111'; x.fillText(val, tx + wE, iY + iH / 2);
    x.lineWidth = 2; x.strokeStyle = '#777'; x.beginPath(); x.moveTo(tx + wE - 6, iY + iH / 2 + 30); x.lineTo(tx + wE + wV + 10, iY + iH / 2 + 30); x.stroke();
  };
  dato('SEDE', MAY(r.sede), M, AN / 3, 'left');
  dato('TÉCNICO', r.tecnico, M + AN / 3, AN / 3, 'center');
  dato('MES', `${MESES[d0.getMonth()]} ${d0.getFullYear()}`, M + 2 * AN / 3, AN / 3, 'right');

  // --- Tabla
  const cols = [['HORA', 290], ['DIA', 330], ['SERVICIO', 580], ['NOVEDAD', 0], ['FIRMA TÉCNICO', 480], ['FIRMA JEFE DE SERVICIO', 480]];
  cols[3][1] = AN - cols.reduce((s, c) => s + c[1], 0);
  const tY = iY + iH + 20, thH = 120, fH = 114, tH = thH + FP * fH;
  const xs = [M]; cols.forEach(c => xs.push(xs[xs.length - 1] + c[1]));
  x.fillStyle = '#f3eef0'; x.fillRect(M, tY, AN, thH);
  cols.forEach((c, i) => textoCaja(x, c[0], xs[i], tY, c[1], thH, { max: 44, min: 34, bold: true, lineas: 2 }));

  const regs = r.registros.slice(n * FP, (n + 1) * FP);
  const firmaTec = await cargarImg(r.firmaTecnico);
  for (let i = 0; i < regs.length; i++) {
    const g = regs[i], y = tY + thH + i * fH;
    if (i % 2) { x.fillStyle = '#fbf9f9'; x.fillRect(M, y, AN, fH); }
    textoCaja(x, fHora(g.ts), xs[0], y, cols[0][1], fH, { max: 44, lineas: 1 });
    textoCaja(x, fFecha(g.ts), xs[1], y, cols[1][1], fH, { max: 42, lineas: 1 });
    textoCaja(x, g.servicio, xs[2], y, cols[2][1], fH, { max: 42, min: 28, bold: true, lineas: 3 });
    if (g.novedad === SIN_NOVEDAD) textoCaja(x, SIN_NOVEDAD, xs[3], y, cols[3][1], fH, { max: 40, lineas: 1, color: '#444' });
    else textoCaja(x, g.novedad, xs[3], y, cols[3][1], fH, { max: 38, min: 22, align: 'left', lineas: 4 });
    imgEnCaja(x, firmaTec, xs[4] + 16, y + 6, cols[4][1] - 32, fH - 44);
    textoCaja(x, r.tecnico, xs[4], y + fH - 38, cols[4][1], 34, { max: 26, min: 18, lineas: 1, color: '#333', pad: 10 });
    imgEnCaja(x, await cargarImg(g.firmaJefe), xs[5] + 16, y + 6, cols[5][1] - 32, fH - 44);
    textoCaja(x, g.jefe, xs[5], y + fH - 38, cols[5][1], 34, { max: 26, min: 18, lineas: 1, color: '#333', pad: 10 });
  }
  if (regs.length < FP && n === totalPaginas(r) - 1) {    // cierra la hoja para que no se agreguen filas después
    const y = tY + thH + regs.length * fH;
    textoCaja(x, '— FIN DE LA RONDA —', M, y, AN, fH, { max: 34, lineas: 1, color: '#8a8a8a' });
  }
  x.strokeStyle = LIN; x.lineWidth = 2; x.beginPath();
  for (let i = 1; i < FP; i++) { const y = tY + thH + i * fH; x.moveTo(M, y); x.lineTo(M + AN, y); } x.stroke();
  x.lineWidth = 4; x.beginPath(); x.moveTo(M, tY + thH); x.lineTo(M + AN, tY + thH);
  for (let i = 1; i < cols.length; i++) { x.moveTo(xs[i], tY); x.lineTo(xs[i], tY + tH); } x.stroke();
  x.strokeRect(M, tY, AN, tH);

  // --- Pie
  const pY = tY + tH + 16, pH = H - pY - 40;
  textoCaja(x, `Ronda ${r.id}  ·  ${r.registros.length} servicio(s), ${conNovedad(r)} con novedad  ·  Inicio ${fHora(r.inicio)} – Fin ${fHora(r.fin || r.inicio)} del ${fFecha(r.inicio)}`,
    M, pY, AN * 0.72, pH, { max: 30, min: 22, align: 'left', lineas: 1, color: '#555', pad: 4 });
  textoCaja(x, 'Registro digital · Clínica Reina Catalina', M + AN * 0.72, pY, AN * 0.28, pH, { max: 30, min: 22, align: 'right', lineas: 1, color: '#555', pad: 4 });
  return c;
}
const paginaBlob = async (r, n) => { const c = await renderPagina(r, n); return new Promise(res => c.toBlob(res, 'image/jpeg', CONFIG.CALIDAD_JPG)); };
const paginaDataURL = async (r, n) => (await renderPagina(r, n)).toDataURL('image/jpeg', CONFIG.CALIDAD_JPG);
const nombreJPG = (id, sede, n, total) => `RONDA_GASES_${MAY(sede)}_${id}_HOJA${n + 1}de${total}.jpg`;
function descargar(blobOUrl, nombre) {
  const url = typeof blobOUrl === 'string' ? blobOUrl : URL.createObjectURL(blobOUrl);
  const a = document.createElement('a'); a.href = url; a.download = nombre; document.body.appendChild(a); a.click(); a.remove();
  if (typeof blobOUrl !== 'string') setTimeout(() => URL.revokeObjectURL(url), 30000);
}

// Las hojas del reporte pesan cerca de 1 MB: se piden en trozos pequeños porque
// Apps Script no entrega bien respuestas tan grandes de una sola vez.
async function bajarPagina(rondaId, pagina) {
  let b64 = '', total = Infinity;
  while (b64.length < total) {
    const j = await api('pagina', { rondaId, pagina, desde: b64.length }, 60000);
    if (j.jpg) return j.jpg;                       // servidor antiguo: lo entrega completo
    if (!j.parte) throw new Error('El servidor no devolvió la hoja.');
    b64 += j.parte; total = j.total;
  }
  return 'data:image/jpeg;base64,' + b64;
}

/* =========================== Vista: historial =========================== */
const DIAS = ['DOM', 'LUN', 'MAR', 'MIÉ', 'JUE', 'VIE', 'SÁB'];
const filtroHist = { mes: '', nov: false };
function grupoDe(fecha) {
  const hoy = new Date(); hoy.setHours(0, 0, 0, 0);
  const lunes = new Date(hoy); lunes.setDate(hoy.getDate() - ((hoy.getDay() + 6) % 7));
  const lunesAnt = new Date(lunes); lunesAnt.setDate(lunes.getDate() - 7);
  if (fecha >= lunes) return 'Esta semana';
  if (fecha >= lunesAnt) return 'Semana anterior';
  return `${MESES[fecha.getMonth()]} ${fecha.getFullYear()}`;
}
vistas.historial = ({ sede }) => {
  sede = sede || ajustes.sede;
  const locales = rondas.filter(r => r.sede === sede && r.estado === 'finalizada');
  const idsLoc = new Set(locales.map(r => r.id));
  const todas = [
    ...locales.map(r => ({ id: r.id, orden: r.inicio, tecnico: r.tecnico, servicios: r.registros.length, novedades: conNovedad(r), paginas: totalPaginas(r), subida: !!r.subida, local: true })),
    ...(histCache[sede] || []).filter(h => !idsLoc.has(h.id)).map(h => ({ ...h, subida: true, local: false }))
  ].map(f => ({ ...f, f: new Date(f.orden) })).filter(f => !isNaN(f.f)).sort((a, b) => b.f - a.f);
  const clave = d => `${d.getFullYear()}-${p2(d.getMonth() + 1)}`;
  const meses = [...new Set(todas.map(f => clave(f.f)))];
  if (filtroHist.mes && !meses.includes(filtroHist.mes)) filtroHist.mes = '';
  const filas = todas.filter(f => (!filtroHist.mes || clave(f.f) === filtroHist.mes) && (!filtroHist.nov || +f.novedades > 0));
  const nomMes = k => { const [y, m] = k.split('-'); return `${MESES[+m - 1][0]}${MESES[+m - 1].slice(1).toLowerCase()} ${y}`; };

  let html = '', grupo = '';
  for (const f of filas) {
    const g = grupoDe(f.f);
    if (g !== grupo) { html += `<div class="grupo">${esc(g)}</div>`; grupo = g; }
    const nv = +f.novedades || 0;
    html += `<button class="ronda-h" data-id="${esc(f.id)}">
      <div class="d"><b>${f.f.getDate()}</b><span>${DIAS[f.f.getDay()]}</span></div>
      <div style="min-width:0"><div class="n">${esc(f.tecnico)}</div>
        <div class="m">${fHora(f.f)} · ${esc(f.servicios)} servicios${f.subida ? '' : ' · <b>por subir</b>'}</div></div>
      ${nv ? `<span class="tag tn">${ic('exclam')}${nv} novedad${nv > 1 ? 'es' : ''}</span>` : `<span class="tag ts">${ic('check')}Sin novedad</span>`}
    </button>`;
  }

  app.innerHTML = `
    ${barra('Historial de rondas', 'Todos los técnicos de la sede')}
    ${franja()}
    <div class="pestanas" role="tablist">${CONFIG.SEDES.map(s => `<button role="tab" data-sede="${esc(s)}" aria-selected="${s === sede}">${esc(s)}</button>`).join('')}</div>
    <div class="filtros">
      <label class="filtro ${filtroHist.mes ? 'on' : ''}">${ic('calendario')}<span>${filtroHist.mes ? nomMes(filtroHist.mes) : 'Todos los meses'}</span>${ic('abajo')}
        <select id="fMes" aria-label="Mes"><option value="">Todos los meses</option>${meses.map(k => `<option value="${k}" ${k === filtroHist.mes ? 'selected' : ''}>${nomMes(k)}</option>`).join('')}</select></label>
      <button class="filtro ${filtroHist.nov ? 'on' : ''}" id="fNov" aria-pressed="${filtroHist.nov}">${ic('alerta')}Solo con novedad</button>
    </div>
    <p class="nota" id="hNota" style="margin:6px 2px 0;font-size:13px"></p>
    ${filas.length ? html : `<div class="vacio">${todas.length ? 'Ninguna ronda cumple el filtro.' : `Todavía no hay rondas de ${esc(sede)}.`}</div>`}`;
  activarAtras(); pintarEstado();
  $$('.pestanas [data-sede]').forEach(b => b.onclick = () => ir('historial', { sede: b.dataset.sede }, true));
  $('#fMes').onchange = e => { filtroHist.mes = e.target.value; pintar(); };
  $('#fNov').onclick = () => { filtroHist.nov = !filtroHist.nov; pintar(); };
  $$('[data-id]').forEach(b => b.onclick = () => {
    const f = filas.find(z => z.id === b.dataset.id);
    ir('detalle', f.local ? { id: f.id } : { id: f.id, remota: { id: f.id, sede, fecha: fFecha(f.f), tecnico: f.tecnico, servicios: f.servicios, novedades: f.novedades, paginas: f.paginas } });
  });
  const nota = $('#hNota');
  if (!apiLista()) nota.textContent = 'Mostrando las rondas guardadas en este teléfono.';
  else if (!navigator.onLine) nota.textContent = 'Sin señal: se muestra lo último que se alcanzó a consultar.';
  else if (vistas.historial.cargado !== sede + Math.floor(Date.now() / 60000)) {
    nota.textContent = 'Consultando la hoja de Google…';
    api('historial', { sede }, 45000).then(j => {
      histCache[sede] = j.rondas || []; LS.set('historial', histCache);
      vistas.historial.cargado = sede + Math.floor(Date.now() / 60000);
      if (actual.v === 'historial' && (actual.p.sede || ajustes.sede) === sede) pintar();
    }).catch(e => { if (nota.isConnected) nota.textContent = 'No se pudo consultar la hoja: ' + (e.message || ''); if (e.tipo === 'ACCESO') pedirCodigo(true); });
  } else nota.hidden = true;
};

/* ============================ Vista: ajustes ============================ */
vistas.ajustes = () => {
  const borr = vistas.ajustes.borrador || (vistas.ajustes.borrador = JSON.parse(JSON.stringify(tecnicos)));
  const sucio = JSON.stringify(borr) !== JSON.stringify(tecnicos);
  const sede = ajustes.sede, m = mem(sede);
  app.innerHTML = `
    ${barra('Ajustes')}
    ${franja()}
    <div class="titulo-sec"><h3>Técnicos</h3><span>requiere clave de administrador</span></div>
    ${CONFIG.SEDES.map(s => `<div class="tarjeta"><span class="etq">${esc(s)}</span>
      ${(borr[s] || []).map((t, i) => `<div class="item" style="box-shadow:none"><button class="cuerpo" data-ren="${esc(s)}|${i}"><span class="nombre">${esc(t)}</span>${ic('editar', 'chev')}</button><button class="x" data-del="${esc(s)}|${i}" aria-label="Quitar ${esc(t)}">${ic('x')}</button></div>`).join('') || '<p class="nota" style="margin-bottom:8px">Sin técnicos.</p>'}
      <button class="btn sec chico" data-add="${esc(s)}">${ic('mas')}Agregar técnico</button></div>`).join('')}
    ${sucio ? `<div class="fila" style="margin-bottom:12px"><button class="btn sec" id="bDesh">Deshacer</button><button class="btn" id="bGuardarTec">Guardar técnicos</button></div>` : ''}

    <div class="titulo-sec"><h3>Servicios recordados · ${esc(sede)}</h3><span>${m.servicios.length}</span></div>
    ${m.servicios.map(s => `<div class="item"><div class="cuerpo"><span class="nombre">${esc(s)}</span></div><button class="x" data-olv="${esc(s)}" aria-label="Olvidar ${esc(s)}">${ic('x')}</button></div>`).join('') || `<div class="vacio">Se llenan solos al hacer rondas.</div>`}

    <div class="titulo-sec"><h3>Conexión</h3></div>
    <button class="btn sec" id="bCod">${ic('llave')}${ajustes.codigo ? 'Cambiar código de acceso' : 'Escribir código de acceso'}</button>
    <p class="nota" style="text-align:center;margin-top:20px;font-size:12px">${esc(CONFIG.FORMATO.nombre)}<br>${esc(CONFIG.FORMATO.codigo)} · Versión ${esc(CONFIG.FORMATO.version)} · App ${CONFIG.VERSION_APP}</p>`;
  activarAtras(); pintarEstado();
  alSalir = () => { if (actual.v !== 'ajustes') vistas.ajustes.borrador = null; };
  $$('[data-add]').forEach(b => b.onclick = async () => {
    const n = MAY(await pedir(`Nombre del nuevo técnico de ${b.dataset.add}:`, { mayus: true, si: 'Agregar' }));
    if (!n) return; (borr[b.dataset.add] = borr[b.dataset.add] || []).includes(n) || borr[b.dataset.add].push(n); pintar();
  });
  $$('[data-ren]').forEach(b => b.onclick = async () => {
    const [s, i] = b.dataset.ren.split('|'); const n = MAY(await pedir('Corregir nombre del técnico:', { mayus: true, valor: borr[s][i] }));
    if (n) { borr[s][i] = n; pintar(); }
  });
  $$('[data-del]').forEach(b => b.onclick = () => { const [s, i] = b.dataset.del.split('|'); borr[s].splice(+i, 1); pintar(); });
  const bd = $('#bDesh'); if (bd) bd.onclick = () => { vistas.ajustes.borrador = null; pintar(); };
  const bg = $('#bGuardarTec'); if (bg) bg.onclick = async () => {
    if (!apiLista()) return toast('Primero hay que conectar la app a la hoja de Google', 3500);
    if (!navigator.onLine) return toast('Se necesita internet para cambiar los técnicos');
    const clave = await pedir('Clave de administrador:', { tipo: 'password', si: 'Guardar' }); if (!clave) return;
    try {
      const j = await api('guardarTecnicos', { clave, tecnicos: borr }, 45000);
      tecnicos = j.tecnicos; LS.set('tecnicos', tecnicos); vistas.ajustes.borrador = null; toast('Técnicos actualizados'); pintar();
    } catch (e) { toast(e.message || 'No se pudo guardar', 3500); if (e.tipo === 'ACCESO') pedirCodigo(true); }
  };
  $$('[data-olv]').forEach(b => b.onclick = async () => {
    const s = b.dataset.olv; if (!await preguntar(`¿Olvidar "${s}"? Dejará de aparecer en las rondas de ${sede}.`, 'Olvidar', 'Cancelar', true)) return;
    m.servicios = m.servicios.filter(n => n !== s); if (!m.ocultos.includes(s)) m.ocultos.push(s); guardarMemoria(); pintar();
  });
  $('#bCod').onclick = () => pedirCodigo().then(ok => ok && pintar());
};

/* ============================== Arranque ============================== */
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); eventoInstalar = e; if (actual.v === 'inicio') pintar(); });
window.addEventListener('appinstalled', () => { eventoInstalar = null; if (actual.v === 'inicio') pintar(); });
window.addEventListener('online', () => { pintarEstado(); cargarConfig(); sincronizar(); });
window.addEventListener('offline', pintarEstado);
document.addEventListener('visibilitychange', () => { if (!document.hidden) sincronizar(); });
setInterval(sincronizar, 120000);   // reintenta sola mientras quede algo por subir

(async function iniciar() {
  try { rondas = await DB.todas(); } catch (e) { toast('No se pudo abrir el almacenamiento del teléfono', 5000); }
  // Limpia copias locales viejas que ya están en la hoja de Google
  const limite = Date.now() - CONFIG.DIAS_COPIA_LOCAL * 864e5;
  for (const r of rondas.filter(r => r.subida && new Date(r.inicio).getTime() < limite)) { await DB.borrar(r.id); rondas = rondas.filter(x => x !== r); }
  history.replaceState({ v: 'inicio', p: {} }, '');
  actual = { v: 'inicio', p: {} }; pintar();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => { });
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => { });
  if (apiLista() && !ajustes.codigo) await pedirCodigo();
  else { cargarConfig(); sincronizar(); }
})();
</script>
</body>
</html>
